<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#142744"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#C4F5FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>

  <!-- Soft glow -->
  <circle cx="1100" cy="70" r="90" fill="#38BDF8" opacity="0.05"/>

  <!-- Layered wave -->
  <g fill="none" stroke-linecap="round">

    <!-- ===== Harmonic Ribbon Wave ===== -->
<!-- ========= 3D MULTI-STRAND WAVE ========= -->
<g fill="none" stroke-linecap="round">

  <!-- Back strands -->
  <path d="M-40 250 C120 330,250 110,420 220 S760 330,930 150 S1180 250,1320 180"
        stroke="#0EA5E9" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M-40 258 C120 338,250 118,420 228 S760 338,930 158 S1180 258,1320 188"
        stroke="#22D3EE" stroke-opacity="0.10" stroke-width="1"/>
  <path d="M-40 266 C120 346,250 126,420 236 S760 346,930 166 S1180 266,1320 196"
        stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Middle ribbon -->
  <path d="M-40 240 C120 320,250 100,420 210 S760 320,930 140 S1180 240,1320 170"
        stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.2"/>
  <path d="M-40 244 C120 324,250 104,420 214 S760 324,930 144 S1180 244,1320 174"
        stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.3"/>
  <path d="M-40 248 C120 328,250 108,420 218 S760 328,930 148 S1180 248,1320 178"
        stroke="#67E8F9" stroke-opacity="0.50" stroke-width="1.5"/>

  <!-- MAIN GLOWING STRAND -->
  <path d="M-40 252 C120 332,250 112,420 222 S760 332,930 152 S1180 252,1320 182"
        stroke="#E0FBFF" stroke-width="4.2" filter="url(#glow)"/>
  <path d="M-40 252 C120 332,250 112,420 222 S760 332,930 152 S1180 252,1320 182"
        stroke="#67E8F9" stroke-width="2.6"/>

  <!-- Front strands -->
  <path d="M-40 256 C120 336,250 116,420 226 S760 336,930 156 S1180 256,1320 186"
        stroke="#BFF7FF" stroke-opacity="0.65" stroke-width="1.4"/>
  <path d="M-40 260 C120 340,250 120,420 230 S760 340,930 160 S1180 260,1320 190"
        stroke="#CFFAFE" stroke-opacity="0.45" stroke-width="1.2"/>
  <path d="M-40 264 C120 344,250 124,420 234 S760 344,930 164 S1180 264,1320 194"
        stroke="#E0FBFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Pale yellow accent -->
  <path d="M-40 282 C150 170,320 300,520 255 S850 120,1030 240 S1220 300,1320 210"
        stroke="#F6E58D" stroke-opacity="0.75" stroke-width="1.6"/>

</g>
    </g>
  <!-- Name -->
  <text x="80" y="120"
        font-family="Didot, Bodoni MT, Times New Roman, serif"
        font-size="64"
        font-weight="400"
        fill="#F8FAFC">
    Sandhya Elumalai
  </text>

</svg>
