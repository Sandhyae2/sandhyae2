    <circle
        cx="1120"
        cy="55"
        r="60"
        fill="#38BDF8"
        opacity="0.025"/>


    <!-- ================================================= -->
    <!-- ALL WAVES -->
    <!-- ================================================= -->

    <g
        fill="none"
        stroke-linecap="round">


      <!-- ================================================= -->
      <!-- VERY FAR BACK WAVES -->
      <!-- ================================================= -->

      <path
