<svg width="1280" height="600" viewBox="0 0 1280 600"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="55%" stop-color="#031126"/>
      <stop offset="100%" stop-color="#061A32"/>
    </linearGradient>


    <!-- ================================================= -->
    <!-- CYAN WAVE GRADIENT -->
    <!-- ================================================= -->

    <linearGradient id="cyanWave"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="65%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#CFFAFE"/>

    </linearGradient>


    <!-- ================================================= -->
    <!-- YELLOW GRADIENT -->
    <!-- ================================================= -->

    <linearGradient id="yellowWave"
                    x1="0" y1="0"
                    x2="1" y2="0">

      <stop offset="0%" stop-color="#D6B84C"/>
      <stop offset="45%" stop-color="#F6E58D"/>
      <stop offset="75%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#C9A83E"/>

    </linearGradient>


    <!-- ================================================= -->
    <!-- STRONG GLOW -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-30%"
            y="-100%"
            width="160%"
            height="300%">

      <feGaussianBlur
          stdDeviation="5"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================================================= -->
    <!-- SOFT GLOW -->
    <!-- ================================================= -->

    <filter id="softGlow"
            x="-50%"
            y="-200%"
            width="200%"
            height="500%">

      <feGaussianBlur stdDeviation="2.5"/>

    </filter>


    <!-- ================================================= -->
    <!-- PARTICLE GLOW -->
    <!-- ================================================= -->

    <filter id="particleGlow"
            x="-200%"
            y="-200%"
            width="400%"
            height="400%">

      <feGaussianBlur
          stdDeviation="2"/>

    </filter>


    <!-- ================================================= -->
    <!-- WAVE CLIPPING AREA -->
    <!-- Waves are ONLY allowed in the top 320px -->
    <!-- ================================================= -->

    <clipPath id="waveArea">
      <rect x="0" y="0" width="1280" height="320"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- FULL BACKGROUND -->
  <!-- Covers banner + Know Me section -->
  <!-- ================================================= -->

  <rect
      width="1280"
      height="600"
      rx="20"
      fill="url(#bg)"/>


  <!-- ================================================= -->
  <!-- EVERYTHING ABOVE THIS LINE IS THE WAVE AREA -->
  <!-- Waves are clipped at y=320 -->
  <!-- ================================================= -->

  <g clip-path="url(#waveArea)">

    <!-- subtle background glow -->

    <circle
        cx="1120"
        cy="55"
        r="80"
        fill="#0EA5E9"
