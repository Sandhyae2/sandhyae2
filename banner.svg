    <!-- ================================================= -->

    <g fill="#67E8F9">

      <circle cx="72" cy="282" r="1.4"/>
      <circle cx="145" cy="247" r="1.1"/>
      <circle cx="218" cy="294" r="1.5"/>
      <circle cx="354" cy="218" r="1.2"/>
